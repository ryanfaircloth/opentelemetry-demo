name: Test image generation

on:
  push:
    paths:
      - 'src/**'
      - 'test/**'
  workflow_dispatch:
    inputs:
      force_build:
        description: Build and push every component regardless of detected changes (use for chart/config-only releases, which touch no src/** files and would otherwise publish no images)
        default: false
        required: false
        type: boolean

permissions:
  contents: read

jobs:
  build_images:
    name: Build images
    permissions:
      contents: read  # required by the component-build-images reusable workflow
      packages: write  # required to push built images to GHCR
    uses: ./.github/workflows/component-build-images.yml
    with:
      push: true
      force_build: ${{ inputs.force_build || false }}
      ghcr_repo: ghcr.io/ryanfaircloth/demo
      dockerhub_repo: ryanfaircloth/demo
