{{- $httpRoute := .Values.otelCollectorHTTPRoute }}
{{- $frontend := index .Values.components "frontend" }}
{{/*
The frontend is the app only - it proxies nothing. Every same-origin path the
browser depends on (/otlp-http trace export, /flagservice feature flags,
/images product images) must be routed at the gateway, so publishing the
frontend's httpRoute without those routes ships a silently broken store.
Fail fast instead. The absolute-URL override on
PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT remains the escape hatch for
collectors routed outside the chart.
*/}}
{{- if and $frontend $frontend.httpRoute $frontend.httpRoute.enabled }}
{{-   $browserEndpoint := "" }}
{{-   range ($frontend.env | default list) }}
{{-     if eq .name "PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT" }}{{ $browserEndpoint = printf "%v" .value }}{{- end }}
{{-   end }}
{{-   range ($frontend.envOverrides | default list) }}
{{-     if eq .name "PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT" }}{{ $browserEndpoint = printf "%v" .value }}{{- end }}
{{-   end }}
{{-   if and (hasPrefix "/" $browserEndpoint) (not (and $httpRoute $httpRoute.enabled)) }}
{{-     fail "components.frontend.httpRoute is enabled but otelCollectorHTTPRoute is not: the frontend proxies nothing, so the browser's trace export (relative PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, default /otlp-http/v1/traces) needs the gateway to route /otlp-http to the collector. Enable otelCollectorHTTPRoute, or set an absolute URL via components.frontend.envOverrides." }}
{{-   end }}
{{-   $flagd := index .Values.components "flagd" }}
{{-   if and $flagd $flagd.enabled (not (and $flagd.httpRoute $flagd.httpRoute.enabled)) }}
{{-     fail "components.frontend.httpRoute is enabled but components.flagd.httpRoute is not: the frontend proxies nothing, so the browser's feature flags need the gateway to route /flagservice to flagd. Set components.flagd.httpRoute.enabled: true (rules default to the chart's canonical /feature and /flagservice wiring), or disable the flagd component." }}
{{-   end }}
{{-   $imageProvider := index .Values.components "image-provider" }}
{{-   if and $imageProvider $imageProvider.enabled (not (and $imageProvider.httpRoute $imageProvider.httpRoute.enabled)) }}
{{-     fail "components.frontend.httpRoute is enabled but components.image-provider.httpRoute is not: the frontend proxies nothing, so product images need the gateway to route /images to image-provider. Set components.image-provider.httpRoute.enabled: true (rules default to the chart's canonical /images wiring), or disable the image-provider component." }}
{{-   end }}
{{- end }}
{{/*
The route's backend defaults to the sub-chart's own in-namespace
otel-collector Service. Deployments that bring their own collector (the
sub-chart disabled, collector running elsewhere) override backendRef.name/
namespace; a cross-namespace backend renders the ReferenceGrant Gateway API
requires in the collector's namespace (disable via referenceGrant.enabled
when that namespace's owner manages grants itself).
*/}}
{{- $backendName := "otel-collector" }}
{{- $backendNamespace := "" }}
{{- if and $httpRoute $httpRoute.backendRef }}
{{-   $backendName = $httpRoute.backendRef.name | default "otel-collector" }}
{{-   $backendNamespace = $httpRoute.backendRef.namespace | default "" }}
{{- end }}
{{- $crossNamespace := and $backendNamespace (ne $backendNamespace .Release.Namespace) }}
{{/*
The paths are this chart's responsibility, not the consumer's: a route with
no rules configured serves the canonical /otlp-http -> collector:4318 (path
prefix stripped) wiring that the frontend's browser export posts to.
parentRefs/hostnames are deployment facts the chart cannot invent, but when
the frontend is published via this chart's own httpRoute they default to the
frontend's, so the two routes merge onto the same virtual host; otherwise
they must be set explicitly, and rendering fails fast if none are available.
*/}}
{{- $defaultRules := list (dict "matches" (list (dict "path" (dict "type" "PathPrefix" "value" "/otlp-http"))) "rewritePath" "/" "port" 4318) }}
{{- $frontendParentRefs := list }}
{{- $frontendHostnames := list }}
{{- if and $frontend $frontend.httpRoute $frontend.httpRoute.enabled }}
{{-   $frontendParentRefs = $frontend.httpRoute.parentRefs | default list }}
{{-   $frontendHostnames = $frontend.httpRoute.hostnames | default list }}
{{- end }}
{{- if and $httpRoute $httpRoute.enabled }}
{{- $httpRoutes := list $httpRoute }}
{{- if $httpRoute.additionalHTTPRoutes }}
{{-   $httpRoutes = concat $httpRoutes $httpRoute.additionalHTTPRoutes -}}
{{- end }}
{{- range $httpRoutes }}
{{- $parentRefs := .parentRefs | default $frontendParentRefs }}
{{- $hostnames := .hostnames | default $frontendHostnames }}
{{- $rules := .rules | default $defaultRules }}
{{- if not $parentRefs }}
{{-   fail "otelCollectorHTTPRoute is enabled but has no parentRefs and there is no enabled components.frontend.httpRoute to inherit them from - set otelCollectorHTTPRoute.parentRefs to your Gateway." }}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  {{- if .name }}
  name: otel-collector-{{ .name | lower }}
  {{- else }}
  name: otel-collector
  {{- end }}
  labels:
    {{- include "otel-demo.labels" $ | nindent 4 }}
  {{- if .annotations }}
  annotations:
    {{ toYaml .annotations | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- range $parentRefs }}
    - name: {{ .name }}
      {{- with .namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .sectionName }}
      sectionName: {{ . }}
      {{- end }}
    {{- end }}
  {{- if $hostnames }}
  hostnames:
    {{- range $hostnames }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $rules }}
    - matches:
        {{- range .matches }}
        - path:
            type: {{ .path.type }}
            value: {{ .path.value }}
        {{- end }}
      {{- if .rewritePath }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: {{ .rewritePath }}
      {{- end }}
      backendRefs:
        - name: {{ $backendName }}
          {{- if $crossNamespace }}
          namespace: {{ $backendNamespace }}
          {{- end }}
          port: {{ .port }}
      {{- if .timeouts }}
      timeouts:
        {{- with .timeouts.request }}
        request: {{ . }}
        {{- end }}
        {{- with .timeouts.backendRequest }}
        backendRequest: {{ . }}
        {{- end }}
      {{- end }}
    {{- end }}
{{- end}}
{{- $grantEnabled := true }}
{{- if and $httpRoute.referenceGrant (hasKey $httpRoute.referenceGrant "enabled") }}
{{-   $grantEnabled = $httpRoute.referenceGrant.enabled }}
{{- end }}
{{- if and $crossNamespace $grantEnabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: otel-collector-httproute-{{ .Release.Namespace }}
  namespace: {{ $backendNamespace }}
  labels:
    {{- include "otel-demo.labels" $ | nindent 4 }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: {{ .Release.Namespace }}
  to:
    - group: ""
      kind: Service
      name: {{ $backendName }}
{{- end }}
{{- end}}
