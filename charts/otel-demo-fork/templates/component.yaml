{{- $kafkaAccess := $.Values.kafkaAccess | default dict }}
{{- $kafkaAccessMode := $kafkaAccess.mode | default "kafkaAccess" }}
{{- $postgresAccess := $.Values.postgresAccess | default dict }}
{{- $postgresAccessMode := $postgresAccess.mode | default "cnpg" }}
{{- range $name, $config := .Values.components }}
    {{- $config := set . "Capabilities" $.Capabilities }}
    {{- $config := set . "Template" $.Template }}
    {{- $config := set . "name" ($name | lower) }}
    {{- $config := set . "Release" $.Release }}
    {{- $config := set . "Chart" $.Chart }}
    {{- $config := set . "serviceAccount" $.Values.serviceAccount }}
    {{- $config := set . "observability" $.Values.observability }}
    {{- $config := set . "defaultValues" $.Values.default }}
    {{- $config := set . "kafkaAccess" $kafkaAccess }}
    {{- $config := set . "postgresAccess" $postgresAccess }}
    {{- $config := set . "frontendHTTPRoute" ((index $.Values.components "frontend").httpRoute | default dict) }}

    {{/* The bundled single-broker Kafka is deprecated legacy-mode-only: it is
    force-disabled whenever kafkaAccess.mode is not "legacy", regardless of
    its own `enabled` value, so switching the single global mode switch back
    to "legacy" is enough to bring it back without touching this flag. */}}
    {{- $enabled := $config.enabled }}
    {{- if and (eq $config.name "kafka") (ne $kafkaAccessMode "legacy") }}
      {{- $enabled = false }}
    {{- end }}

    {{/* The bundled single-instance Postgres Deployment is legacy-mode-only:
    it is force-disabled whenever postgresAccess.mode is not "legacy",
    regardless of its own `enabled` value - see templates/postgresql-cnpg.yaml
    for the default cnpg-mode replacement. */}}
    {{- if and (eq $config.name "postgresql") (ne $postgresAccessMode "legacy") }}
      {{- $enabled = false }}
    {{- end }}

    {{- if $enabled -}}
        {{- include "otel-demo.deployment" $config -}}
        {{- include "otel-demo.service" $config -}}
        {{- include "otel-demo.httproute" $config -}}
        {{- include "otel-demo.configmap" $config -}}
    {{ end }}

{{- end }}
