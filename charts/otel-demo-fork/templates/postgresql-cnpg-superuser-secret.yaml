{{/* Fixed demo-only superuser credential so the OTel discovery metrics
scraper annotations below (postgresAccess.cnpg.podAnnotations) can keep
authenticating the same way the bundled legacy Deployment does. See
templates/postgresql-cnpg.yaml (spec.superuserSecret). */}}
{{- if eq ((.Values.postgresAccess).mode | default "cnpg") "cnpg" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-superuser" (((.Values.postgresAccess).cnpg).clusterName | default "postgresql") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otel-demo.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  password: {{ ((.Values.postgresAccess).cnpg).superuserPassword | default "otel" | quote }}
{{- end }}
