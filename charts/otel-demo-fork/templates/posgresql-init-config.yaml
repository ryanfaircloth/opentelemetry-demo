{{/* Legacy bundled Postgres only - see templates/postgresql-cnpg-init-config.yaml
for the cnpg-mode equivalent. */}}
{{- if and .Values.components.postgresql.enabled (eq ((.Values.postgresAccess).mode | default "cnpg") "legacy") -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otel-demo.labels" . | nindent 4 }}
data:
  {{ (.Files.Glob "postgresql/legacy/*.sql").AsConfig | nindent 2 }}
{{- end }}
