---
# Source: otel-demo-fork/templates/opentelemetrycollector-cr.yaml
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector
  labels:
    helm.sh/chart: otel-demo-fork-0.11.67
    app.kubernetes.io/name: otel-demo-fork
    app.kubernetes.io/instance: test
    
    app.kubernetes.io/version: "0.11.67"
    app.kubernetes.io/part-of: opentelemetry-demo
    app.kubernetes.io/managed-by: Helm
spec:
  mode: daemonset
  image: "otel/opentelemetry-collector-contrib:0.155.0"
  resources:
    limits:
      cpu: 300m
      memory: 200Mi
    requests:
      cpu: 50m
      memory: 100Mi
  config:
    connectors:
      spanmetrics: {}
    exporters:
      otlp/observability-backend:
        endpoint: my-observability-endpoint:4317
        sending_queue:
          batch: {}
        tls:
          insecure: true
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      resource:
        attributes:
        - action: insert
          from_attribute: k8s.pod.uid
          key: service.instance.id
      resourcedetection:
        detectors:
        - env
        - system
      transform:
        error_mode: ignore
        trace_statements:
        - conditions:
          - span.kind == SPAN_KIND_SERVER and resource.attributes["service.name"] == "frontend"
            and span.attributes["http.route"] == nil
          context: span
          statements:
          - set(span.attributes["http.route"], "/api/cart") where IsMatch(span.attributes["http.target"],
            "\\/api\\/cart")
          - set(span.attributes["http.route"], "/api/checkout") where IsMatch(span.attributes["http.target"],
            "\\/api\\/checkout")
          - set(span.attributes["http.route"], "/api/products/{productId}") where IsMatch(span.attributes["http.target"],
            "\\/api\\/products\\/.*")
          - set(span.attributes["http.route"], "/api/recommendations") where IsMatch(span.attributes["http.target"],
            "\\/api\\/recommendations")
          - set(span.attributes["http.route"], "/api/data") where IsMatch(span.attributes["http.target"],
            "\\/api\\/data.*")
        - context: span
          statements:
          - set_semconv_span_name("1.37.0", "unsanitized_span_name")
    receivers:
      kafkametrics:
        brokers:
        - kafka:9092
        collection_interval: 10s
        scrapers:
        - brokers
        - topics
        - consumers
      otlp:
        protocols:
          http:
            cors:
              allowed_origins:
              - http://*
              - https://*
    service:
      pipelines:
        logs:
          exporters:
          - otlp/observability-backend
          - debug
          processors:
          - memory_limiter
          - resourcedetection
          - resource
          - batch
        metrics:
          exporters:
          - otlp/observability-backend
          - debug
          processors:
          - memory_limiter
          - resourcedetection
          - resource
          - batch
          receivers:
          - otlp
          - kafkametrics
          - spanmetrics
        traces:
          exporters:
          - otlp/observability-backend
          - debug
          - spanmetrics
          processors:
          - memory_limiter
          - resourcedetection
          - resource
          - transform
          - batch
      telemetry:
        metrics:
          level: detailed
          readers:
          - periodic:
              exporter:
                otlp:
                  endpoint: http://otel-collector:4318
                  insecure: true
                  protocol: http/protobuf
              interval: 10000
              timeout: 5000
