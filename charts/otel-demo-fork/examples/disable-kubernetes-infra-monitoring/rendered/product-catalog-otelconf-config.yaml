---
# Source: otel-demo-fork/templates/product-catalog-otelconf-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: product-catalog-otelconf
  namespace: default
  labels:
    helm.sh/chart: otel-demo-fork-0.12.20
    app.kubernetes.io/name: otel-demo-fork
    app.kubernetes.io/instance: example
    
    app.kubernetes.io/version: "0.12.20"
    app.kubernetes.io/part-of: opentelemetry-demo
    app.kubernetes.io/managed-by: Helm
data:
  otel-config.yml: |
    # Copyright The OpenTelemetry Authors
    # SPDX-License-Identifier: Apache-2.0
    
    file_format: "1.0"
    disabled: false
    log_level: info
    logger_provider:
      processors:
        - batch:
            exporter:
              otlp_grpc:
                endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    meter_provider:
      readers:
        - periodic:
            exporter:
              otlp_grpc:
                endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
                temporality_preference: ${OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE:-cumulative}
    tracer_provider:
      processors:
        - batch:
            exporter:
              otlp_grpc:
                endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    propagator:
      composite:
        - tracecontext:
        - baggage:
    resource:
      attributes_list: ${OTEL_RESOURCE_ATTRIBUTES}
      detection/development:
        detectors:
          - container:
          - host:
          - process:
          - service:
