# kafkaAccess mode with manageResources: true is the chart default, shown
# here explicitly for clarity. The chart itself renders the KafkaTopic,
# KafkaUser (one per Kafka-using component, using components.<name>.kafka.role
# below) and KafkaAccess custom resources against the pre-existing Strimzi
# Kafka cluster named/namespaced in kafkaAccess.cluster - no per-app
# hand-authoring required (contrast with ../kafka-access-unmanaged). Each
# KafkaAccess produces a Secret named "<component>-kafka-access".
kafkaAccess:
  mode: kafkaAccess
  cluster:
    name: my-kafka-cluster
    namespace: kafka

components:
  accounting:
    kafka:
      role: consumer
      consumerGroup: accounting
  checkout:
    kafka:
      role: producer
  fraud-detection:
    kafka:
      role: consumer
      consumerGroup: fraud-detection
