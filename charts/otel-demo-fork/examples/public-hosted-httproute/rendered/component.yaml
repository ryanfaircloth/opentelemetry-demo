# Source: otel-demo-fork/templates/component.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounting
  labels:
    helm.sh/chart: otel-demo-fork-0.11.17
    
    opentelemetry.io/name: accounting
    
    app.kubernetes.io/version: "2.2.0"
    app.kubernetes.io/component: accounting
    app.kubernetes.io/name: accounting
    app.kubernetes.io/part-of: opentelemetry-demo
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      
      opentelemetry.io/name: accounting
  template:
    metadata:
      labels:
        
        opentelemetry.io/name: accounting
        
        app.kubernetes.io/version: "2.2.0"
        app.kubernetes.io/component: accounting
        app.kubernetes.io/name: accounting
      annotations:
        resource.opentelemetry.io/service.name: accounting
    spec:
      serviceAccountName: release-name
      containers:
        - name: accounting
          image: 'ghcr.io/ryanfaircloth/demo:0.11.17-accounting'
          imagePullPolicy: IfNotPresent
          env:
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.labels['app.kubernetes.io/component']
            - name: OTEL_COLLECTOR_NAME
              value: otel-collector
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: cumulative
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(OTEL_COLLECTOR_NAME):4318
            - name: OTEL_DOTNET_AUTO_TRACES_ENTITYFRAMEWORKCORE_INSTRUMENTATION_ENABLED
              value: "false"
            
            - name: KAFKA_TOPIC
              value: "orders"
            - name: KAFKA_ADDR
              valueFrom:
                secretKeyRef:
                  name: accounting-kafka-access
                  key: bootstrap.servers
            - name: KAFKA_PROTOCOL
              valueFrom:
                secretKeyRef:
                  name: accounting-kafka-access
                  key: security.protocol
                  optional: true
            - name: KAFKA_SASL_MECHANISM
              valueFrom:
                secretKeyRef:
                  name: accounting-kafka-access
                  key: sasl.mechanism
                  optional: true
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: accounting-kafka-access
                  key: username
                  optional: true
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: accounting-kafka-access
                  key: password
                  optional: true
            - name: KAFKA_SASL_JAAS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: accounting-kafka-access
                  key: sasl.jaas.config
                  optional: true
            - name: KAFKA_SSL_TRUSTSTORE_CRT
              valueFrom:
                secretKeyRef:
                  name: accounting-kafka-access
                  key: ssl.truststore.crt
                  optional: true
            
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: postgresql-app
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: postgresql-app
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-app
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgresql-app
                  key: dbname
            - name: DB_CONNECTION_STRING
              value: "Host=$(DB_HOST);Username=$(DB_USER);Password=$(DB_PASSWORD);Database=$(DB_NAME)"
          resources:
            limits:
              memory: 120Mi
          volumeMounts:
      volumes:
