        app.kubernetes.io/name: cart
      annotations:
        resource.opentelemetry.io/service.name: cart
    spec:
      serviceAccountName: release-name
      containers:
        - name: cart
          image: 'ghcr.io/ryanfaircloth/demo:0.11.17-cart'
