---
# Source: otel-demo-fork/templates/collector-httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: otel-collector
  labels:
    helm.sh/chart: otel-demo-fork-0.5.0
    
    
    app.kubernetes.io/version: "2.2.0"
    app.kubernetes.io/part-of: opentelemetry-demo
    app.kubernetes.io/managed-by: Helm
spec:
  parentRefs:
    - name: otel-demo-gateway
  hostnames:
    - "otel-demo.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /otlp-http
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: otel-collector
          port: 4318
