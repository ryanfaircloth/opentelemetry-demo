# Replaces frontend-proxy's single-origin reverse-proxy behavior with
# Gateway API: every HTTPRoute below shares the same parentRefs/hostnames,
# so Gateway API merges them into one virtual host with path-based routing
# (longest-prefix-match wins, same effect as Envoy's ordered routes).
# Requires a Gateway API controller and a Gateway named "otel-demo-gateway"
# to already exist in the cluster.

opentelemetry-collector:
  config:
    exporters:
      otlp/observability-backend:
        endpoint: "my-observability-endpoint:4317"

components:
  frontend:
    # PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT needs no override: the chart
    # default is the relative path /otlp-http/v1/traces, which the browser
    # resolves against this hostname and otelCollectorHTTPRoute (below) routes
    # to the collector.
    httpRoute:
      enabled: true
      parentRefs:
        - name: otel-demo-gateway
      hostnames:
        - otel-demo.example.com
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          port: 8080

  # /images (product images) - rules, parentRefs, and hostnames all come
  # from the chart: rules default to the canonical /images -> 8081 wiring
  # (served natively by image-provider, no rewrite) and parentRefs/hostnames
  # inherit from the frontend httpRoute above.
  image-provider:
    httpRoute:
      enabled: true

  # /feature (flags admin UI) and /flagservice (the browser's grpc-web flag
  # evaluation) - the chart's default rules carry the required prefix
  # rewrites (flagd serves at its root, no prefix option) and
  # timeouts.request: 0s on /flagservice (the EventStream is one long-lived
  # request; Envoy Gateway's 15s default would sever it). parentRefs/
  # hostnames inherit from the frontend httpRoute above.
  flagd:
    httpRoute:
      enabled: true

  load-generator:
    httpRoute:
      enabled: true
      parentRefs:
        - name: otel-demo-gateway
      hostnames:
        - otel-demo.example.com
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /loadgen
          rewritePath: /
          port: 8089

  telemetry-docs:
    httpRoute:
      enabled: true
      parentRefs:
        - name: otel-demo-gateway
      hostnames:
        - otel-demo.example.com
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /telemetry
          rewritePath: /
          port: 8000

# Routes /otlp-http (the frontend's browser trace export) to the collector.
# The paths, parentRefs, and hostnames all come from the chart: rules default
# to /otlp-http -> collector:4318 with the prefix stripped, and parentRefs/
# hostnames are inherited from the frontend httpRoute above.
otelCollectorHTTPRoute:
  enabled: true
